name: tuk-meeting-room
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tuk_meeting_room
      MYSQL_USER: meeting_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - meeting_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  meeting_mysql:
